name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # 빈 Secrets가 .env.production 값을 덮어쓰지 않도록, 값이 있을 때만 주입합니다.
      - name: Build
        run: |
          if [ -n "$ALLOWED_EMAILS" ]; then
            export VITE_ALLOWED_EMAILS="$ALLOWED_EMAILS"
          fi
          npm run build
          node -e "const fs=require('fs');const html=fs.readFileSync('dist/index.html','utf8');const m=html.match(/assets\\/index-[^\"']+\\.js/);if(!m) process.exit(1);const js=fs.readFileSync('dist/'+m[0],'utf8');if(!js.includes('easy-photobook')){console.error('Firebase config missing from build');process.exit(1)}"
        env:
          ALLOWED_EMAILS: ${{ secrets.VITE_ALLOWED_EMAILS }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
